services:
  - type: web
    name: wrp-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wrp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: wrp-redis
          property: connectionString
      - key: CREDENTIAL_MASTER_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: ENABLE_LLM_JUDGE
        value: "false"
      - key: LLM_JUDGE_DAILY_BUDGET_USD
        value: "10.00"
      - key: MAX_POLL_CONCURRENCY
        value: "10"

  - type: worker
    name: wrp-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    startCommand: "celery -A app.worker.celery_app worker --loglevel=info -B"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wrp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: wrp-redis
          property: connectionString
      - key: CREDENTIAL_MASTER_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false

databases:
  - name: wrp-db
    plan: free
    databaseName: wrp
    user: wrp
    region: oregon

services:
  - type: redis
    name: wrp-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru