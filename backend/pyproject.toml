[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wrp-backend"
version = "1.0.0"
description = "Workflow Reliability Platform - Backend API"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "WRP Team"}]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # Web Framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "gunicorn==23.0.0",

    # Configuration
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",

    # Database
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.31.0",
    "pgvector==0.3.6",
    "pg8000==1.31.5",
    "alembic==1.13.2",

    # Redis & Celery
    "redis==5.2.0",
    "celery[redis]==5.4.0",

    # HTTP Client
    "httpx==0.28.1",

    # Authentication & Security
    "python-jose[cryptography]==3.3.0",
    "pyjwt[crypto]==2.10.1",
    "passlib[bcrypt]==1.7.4",
    "cryptography==43.0.3",
    "python-multipart==0.0.9",

    # Validation & Serialization
    "pydantic[email]==2.9.2",
    "pydantic-extra-types==2.10.0",

    # Observability
    "structlog==24.4.0",
    "prometheus-client==0.20.0",
    # OpenTelemetry (Phase 2+): "opentelemetry-api", "opentelemetry-sdk",
    # "opentelemetry-instrumentation-fastapi", "opentelemetry-exporter-otlp"

    # Utilities
    "croniter==6.0.0",
    "python-dateutil==2.9.0.post0",
    "python-slugify==8.0.4",
    "tenacity==8.5.0",
    "orjson==3.10.11",
    "pyyaml==6.0.2",

    # AI / Embeddings — local, CPU-only (DECISIONS.md, 2026-08-21: no OpenAI key)
    # `pip install` alone resolves torch's default CUDA wheel (several GB). Install
    # from the CPU index instead:
    #   pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
    #   pip install -e .
    # sentence-transformers then reuses whichever torch is already installed.
    "torch==2.13.0",
    "sentence-transformers==6.0.0",

    # Testing
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.1",
    "faker==33.1.0",
    "freezegun==1.5.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.1",
    "mypy==1.13.0",
    "pre-commit==3.8.0",
    "ipython==8.28.0",
    "ipdb==0.13.13",
]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.1",
    "faker==33.1.0",
    "freezegun==1.5.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]  # allow assert and hardcoded passwords in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "alembic.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "croniter.*",
    "jose.*",
    "passlib.*",
    "pgvector.*",
]
ignore_missing_imports = true

# torch and sentence_transformers ship their own (large) type stubs, so
# ignore_missing_imports above does not apply — mypy has something to check,
# it is just enormous, and a first-time full analysis of torch's stub tree ran
# past ten minutes on this machine before being killed. follow_imports="skip"
# stops mypy descending into either package's own types (imported names become
# Any) without needing to parse them, which is the standard fix for this exact
# class of dependency. Both are imported lazily, inside
# app.services.diagnostic.embeddings._model(), specifically so a slow import
# never taxes app/worker startup or test collection; this override keeps
# mypy's own runtime from paying an equivalent cost.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "sentence_transformers.*",
]
follow_imports = "skip"

[tool.coverage.run]
source = ["app"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"