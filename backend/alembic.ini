# Alembic configuration for WRP database migrations.
# Uses async SQLAlchemy with asyncpg driver.

[alembic]
script_location = alembic
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/wrp_dev

# Template used to generate migration files
file_template = %%(year)d_%%(month)02d_%%(day)02d_%%(hour)02d%%(minute)02d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Max length of characters to apply to the "revision" variable
truncate_slug_length = 49

# Set to 'true' to run migrations in 'offline' mode
offline = false

# Prepend to sys.path for alembic configuration
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname = root

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s